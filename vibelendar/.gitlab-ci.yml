.vibelendar-job:
  tags:
    - intd-km001p1
  inherit:
    default: false
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab-ci.yml
        - vibelendar/**/*
    - when: never

vibelendar:build:
  needs: []
  extends: .vibelendar-job
  stage: build
  image:
    name: moby/buildkit:v0.34.1-rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  interruptible: true
  timeout: 30m
  script:
    - sh vibelendar/ci/build.sh
  artifacts:
    reports:
      dotenv: .vibelendar-build.env
    expire_in: 1 week

vibelendar:deploy:
  extends: .vibelendar-job
  stage: deploy
  image:
    name: alpine/kubectl:1.34.2
    entrypoint: [""]
  needs:
    - job: vibelendar:build
      artifacts: true
  resource_group: vibelendar-production
  environment:
    name: vibelendar/production
    deployment_tier: production
  interruptible: false
  timeout: 15m
  before_script:
    - |
      set -eu
      : "${KUBECONFIG_VIBELENDAR:?KUBECONFIG_VIBELENDAR is missing}"
      command -v kubectl >/dev/null
      umask 077
      export KUBE_CONFIG="$CI_PROJECT_DIR/.vibelendar-kubeconfig"
      printf '%s\n' "$KUBECONFIG_VIBELENDAR" > "$KUBE_CONFIG"
      if ! kubectl --kubeconfig="$KUBE_CONFIG" config view -o json >/dev/null 2>&1; then
        printf '%s' "$KUBECONFIG_VIBELENDAR" | base64 -d > "$KUBE_CONFIG"
      fi
      kubectl --kubeconfig="$KUBE_CONFIG" config view -o json >/dev/null
      test -n "$(kubectl --kubeconfig="$KUBE_CONFIG" config view -o jsonpath='{.clusters[0].cluster.server}')"
  script:
    - sh vibelendar/ci/deploy.sh
  after_script:
    - rm -f "$CI_PROJECT_DIR/.vibelendar-kubeconfig"
